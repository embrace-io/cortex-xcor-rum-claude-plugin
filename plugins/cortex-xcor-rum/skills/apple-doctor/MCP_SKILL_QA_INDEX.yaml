  - id: options-customize-only-captures
    title: Customizing only captureServices forces supplying the whole crash stack
    category: options-ergonomics
    platforms: [ios]
    symptoms:
      - "want to customize URLSessionCaptureService options only"
      - "compiler requires crashReporter parameter"
      - "EmbraceCrashReporter doesn't conform to CrashReporter"
    root_cause: |
      Embrace.Options has convenience initializers that default crashReporter,
      backtracer, and symbolicator when captureServices is not supplied. Adding a custom
      captureServices removes that default path and forces the app to specify all
      three explicitly — but EmbraceCrashReporter isn't visible as a CrashReporter
      conformer without additional imports, and the hang detector isn't externally
      constructible. End result: hard to customize one capture service without
      re-declaring the entire crash stack.
    repo_checks:
      - type: grep
        pattern: "CaptureServiceBuilder|Embrace\\.Options\\(|captureServices:"
        languages: [swift]
      - type: grep
        pattern: "crashReporter:|URLSessionCaptureService"
        languages: [swift]
    canonical_answer: |
      This is a known ergonomics rough edge in Embrace.Options. When you add a custom
      `captureServices:` argument, the convenience initializer that defaults the crash
      stack drops away and you're forced to specify `crashReporter`, `backtracer`, and
      `symbolicator` explicitly — and some of those types aren't conveniently visible.

      Two interim patterns that work:

      1. Use `CaptureServiceBuilder().addDefaults().remove(ofType: URLSessionCaptureService.self).add(...)` —
         this gives you the default capture service set with your customized URLSession
         capture swapped in, and keeps the default crash stack intact.

      2. Pass `crashReporter: nil` explicitly if you want to disable crash capture
         entirely. At runtime this works, but note KSCrash is still linked when you
         depend on the `EmbraceIO` product; to fully exclude KSCrash you'd depend on
         `EmbraceCore` directly.

    escalate_if:
      - "a fully public type-safe API is needed to customize"

  - id: hang-detection-hybrid-frameworks
    title: Hangs reported for RN / Flutter / Unity iOS apps are usually false positives
    category: session
    platforms: [react-native, flutter, unity]
    symptoms:
      - "seeing hangs on iOS RN/Flutter/Unity that we don't believe are real"
      - "hang_per_session showing non-zero but we don't see user-visible issues"
    root_cause: |
      Our hang-detection heuristic for iOS relies on main-thread signals that are
      interpreted differently on hybrid frameworks (JS bridge work, Unity main-loop
      scheduling, Flutter engine ticks). For RN/Flutter/Unity iOS apps, the global
      mitigation is a server-side override: hang_per_session reports 0 and the
      dashboard-side rendering is suppressed.
    canonical_answer: |
      The hangs you're seeing are almost certainly false positives. Our iOS hang
      heuristic doesn't distinguish JS-bridge / game-engine / Flutter-engine work
      from genuine main-thread blocks, so hybrid frameworks produce spurious hangs.

      hang_per_session and the related dashboard rendering are suppressed server-side
      for React Native, Flutter, and Unity iOS apps. If you're still seeing them,
      contact XCOR RUM support with your App ID, SDK version and an example session;
      support can check server-side settings for your app.

  - id: rn-otelemetry-bundle-path-OTA
    title: setJavaScriptBundlePath for OTA / Expo updates — which path format?
    category: rn
    platforms: [react-native]
    symptoms:
      - "OTA update crashes not symbolicated"
      - "setJavaScriptBundlePath silently failing"
      - "expo-updates symbolication"
    root_cause: |
      `setJavaScriptBundlePath` is used when the app loads a non-default JS bundle
      (Expo updates, CodePush). The current API swallows file-read errors so the
      the app can't tell whether the path format is wrong or the file is missing.
      Both `file:///var/.../bundle` and `/var/.../bundle` forms are in the wild;
      URL-encoded spaces (%20) add further confusion.
    repo_checks:
      - type: grep
        pattern: "setJavaScriptBundlePath"
        languages: [js, ts, tsx, swift]
      - type: grep
        pattern: "expo-updates|CodePush"
        languages: [js, ts, tsx]
    canonical_answer: |
      `setJavaScriptBundlePath` is how we point the SDK at a non-default JS bundle for
      symbolication (Expo updates, CodePush). Two things to check first:

      1. Path format. Pass the filesystem path, not a URL. Strip any leading `file://`
         scheme. Decode any `%20`-style URL encoding before passing.

      2. File existence. Our current API swallows the underlying file-read error, so a
         wrong path looks identical to a working call. Log the path yourself and confirm
         it exists and is readable at the moment you call.

    escalate_if:
      - "path format is correct, file exists at call time, and symbolication still fails"

  - id: otel-resource-silently-dropped
    title: Custom OTel resource passed via EmbraceIO.OTelOptions on older SDK versions is dropped
    category: options-ergonomics
    platforms: [ios]
    symptoms:
      - "custom resource attributes not appearing on forwarded spans"
      - "service.name not overridable"
      - "passed EmbraceIO.OTelOptions(resource:) and nothing changed"
    root_cause: |
      On older 6.x versions, `EmbraceIO.setup(options:)` called through to
      `Embrace.setup(options:)` without threading the resource. The fix is in current
      SDK: `Sources/EmbraceIO/EmbraceIO.swift` now calls
      `Embrace.setup(options:, otelResources: options.otel?.resource)` so the resource
      passed via `EmbraceIO.OTelOptions(resource:)` is honored.
    repo_checks:
      - type: grep
        pattern: "EmbraceIO\\.OTelOptions|OTelOptions\\(resource:"
        languages: [swift]
      - type: read
        path: "**/Package.resolved,**/Podfile.lock"
        purpose: Read installed XCOR RUM SDK version to determine if the app is on a fixed release.
    canonical_answer: |
      SDK versions before 6.17.0 didn't thread `EmbraceIO.OTelOptions.resource` through
      to the underlying setup, so a custom resource was silently dropped. Fixed in
      6.17.0 (commit `69e9b231`, PR #531) — `EmbraceIO.setup` now passes the resource
      through.

      First step: confirm your installed SDK version. If you're on 6.16.x or earlier,
      upgrading to 6.17.0+ is the cleanest fix. If upgrading
      isn't immediately possible, the deprecated
      `Embrace.client?.metadata.addResource(key:value:lifespan:)` API can be called
      after setup as a temporary workaround.

      If you're on 6.17.0 or later and the resource is still dropped, contact
      XCOR RUM support with your SDK version.
    escalate_if:
      - "the app is on a current SDK version, OTelOptions.resource is set, and resource attributes still don't appear on forwarded spans"
    escalation_template: |
      Symptom: Custom OTelOptions.resource not reflected on forwarded spans
      Customer app ID:
      Installed SDK version:
      Resource attributes set:
      Verified setup call site passes OTelOptions(resource:):

  - id: session-phantom-foreground-from-push
    title: Push notification wakes app → "foreground" session that never ends cleanly
    category: session
    platforms: [ios]
    symptoms:
      - "sessions tagged foreground that shouldn't be"
      - "ghost push notifications causing phantom sessions"
      - "startup span never ends"
      - "first-frame span open for hours"
    root_cause: |
      iOS gives us ambiguous signals for session state at the moment a session begins —
      push wake, prewarming, background fetch, and genuine foreground launches can all
      look similar. If we tag a session foreground when no rendering actually happens,
      our startup / first-frame spans never reach their normal end condition and stay
      open until the user finally foregrounds the app for real. We now drop
      startup spans that don't make sense, but the underlying classification is still
      imperfect.
    canonical_answer: |
      This is a known limitation of iOS session classification. Push notifications, OS
      prewarming, and background fetch can all wake the app in ways that look foreground
      to our detection, but no actual rendering happens — so our first-frame / startup
      spans never meet their normal end condition and stay open until the next real
      foreground.

      Recent SDK versions drop startup spans that don't make sense as a mitigation. If
      you're on an older SDK, upgrading will reduce the noise. There is no complete
      fix; it's a structural limitation of the signals iOS gives the SDK at session
      start. If it persists on a recent SDK version, contact XCOR RUM support with your
      App ID, SDK version and an example session.

  - id: app-size-estimate
    title: How much does the XCOR RUM SDK add to my iOS app binary?
    category: size
    platforms: [ios]
    symptoms:
      - "how much does Embrace add to app size"
      - "our binary grew by X MB after adding Embrace"
      - "customer claims Embrace is larger than documented"
    root_cause: |
      The SDK's binary footprint is ~1-2 MB compressed / ~2-3 MB installed. Measurements
      routinely come in 2-3x higher when they're taken from debug builds,
      including multiple architectures that the App Store thinning would strip, or
      comparing against a build that also changed other dependencies.
    repo_checks:
      - type: read
        path: "**/*.xcconfig,**/project.pbxproj"
        purpose: Determine linkage (static vs dynamic), strip settings, architectures built. Quote only those settings, never credentials.
    canonical_answer: |
      Our documented footprint is ~1-2 MB compressed / ~2-3 MB installed. dSYMs do not
      affect this — they're stand-alone debug files produced at build time and are
      never present on the device. If you're measuring significantly more, a few
      things commonly inflate the number:

      - Debug vs release build — our contribution in debug is much larger.
      - Multiple architectures not stripped from the archive (App Store thinning
        normally handles this in the final per-device download).
      - Other dependencies that changed between the "before" and "after" build.

      To measure precisely, you can rebuild with `LD_GENERATE_MAP_FILE=YES` and attribute
      bytes per object file back to their library.
    escalate_if:
      - "a release, thinned, single-change build measured via linker map still shows XCOR RUM's contribution well above the documented footprint"

  - id: graphql-path-customization
    title: Group GraphQL operations by operation name (not single /graphql endpoint)
    category: network-capture
    platforms: [ios]
    symptoms:
      - "all GraphQL requests grouped under /graphql"
      - "cannot distinguish graphql operations in dashboard"
      - "how to set x-emb-path in 6.x"
    root_cause: |
      In 5.x, customers set the `x-emb-path` header on the request and the server used
      it to classify the endpoint. In 6.x, this is replaced by the URLSession data
      source pattern: implement `URLSessionRequestsDataSource.modifiedRequest(for:)` to
      return a URLRequest whose path reflects the operation. Customers who read the
      mixed docs often set the wrong header or expect 5.x behavior.
    repo_checks:
      - type: grep
        pattern: "URLSessionRequestsDataSource|modifiedRequest\\(for:"
        languages: [swift]
      - type: grep
        pattern: "X-APOLLO-OPERATION-NAME|x-emb-path"
        languages: [swift]
    canonical_answer: |
      In 6.x, the way to classify GraphQL operations is via `URLSessionRequestsDataSource`,
      not the old `x-emb-path` header. Example:

          class ApolloDataSource: NSObject, URLSessionRequestsDataSource {
              func modifiedRequest(for request: URLRequest) -> URLRequest {
                  if let header = request.value(forHTTPHeaderField: "X-APOLLO-OPERATION-NAME") {
                      var modified = request
                      modified.url = request.url?.appendingPathComponent(header)
                      return modified
                  }
                  return request
              }
          }

      And when initializing XCOR RUM:

          let options = Embrace.Options(
              captureServices:
                  CaptureServiceBuilder()
                      .addDefaults()
                      .add(.urlSession(options: .init(requestsDataSource: ApolloDataSource())))
                      .build(),
              // ...
          )

      Key: the header you read must match the header Apollo actually sets on the request.
      `X-APOLLO-OPERATION-NAME` is present by default on Apollo iOS; if you're using a
      different GraphQL client, adapt accordingly.
    escalate_if:
      - "URLSessionRequestsDataSource is implemented and registered, the header is confirmed on outgoing requests, and operations still group under a single /graphql endpoint"

  - id: crashlytics-reports-suppressed-by-ignored-urls
    title: Crashes stop appearing when using CrashlyticsReporter and the Crashlytics upload URL is on the ignore list
    category: crashes
    platforms: [ios, react-native]
    symptoms:
      - "crashes suddenly stopped showing up"
      - "no crashes in Embrace but Crashlytics has them"
      - "crash count dropped to zero after a release"
      - "we use Crashlytics as our crash reporter"
      - "we added ignored URLs / disabledUrlPatterns"
      - "we blocked googleapis.com from network capture"
    root_cause: |
      `CrashlyticsReporter` has no direct hook into Firebase. It captures the crash
      from the HTTP body of the Crashlytics upload request. It listens for the SDK's
      internal "network request captured" notification and only acts when the captured
      URL contains both `crashlyticsreports-pa.googleapis.com` and `batchlog`. That
      notification is posted only for requests the URLSession capture service actually
      captured.

      `ignoredURLs` is a plain substring match against the full URL. Any pattern that is
      a substring of the Crashlytics upload URL — `googleapis.com`, `google`, `.com` —
      silently removes the request from capture, and with it the only path XCOR RUM has
      to the crash. Crashes disappear from XCOR RUM while Crashlytics keeps receiving them.

      The same happens if the URLSession capture service is not enabled at all: no
      capture, no notification, no crashes. With `CrashlyticsReporter`, network capture
      is a hard dependency of crash reporting, not an independent feature.

      There is no exemption for the Crashlytics domain — the ignore list is applied
      before any reporter sees the request.
    repo_checks:
      - type: grep
        pattern: "CrashlyticsReporter\\(\\)|EmbraceCrashlyticsSupport"
        languages: [swift]
        purpose: Confirm Crashlytics — not the default KSCrashReporter — is the installed crash reporter.
      - type: grep
        pattern: "ignoredURLs"
        languages: [swift]
        purpose: Find the ignore list. Read every string in it.
      - type: analyze
        purpose: |
          For each string in `ignoredURLs`, test whether it is a substring of
          `https://crashlyticsreports-pa.googleapis.com/batchlog`. A single match
          explains the outage. Watch for broad patterns (`googleapis.com`, `google`,
          `apis.com`) added to suppress third-party traffic.
      - type: grep
        pattern: "disabledUrlPatterns|disabled_url_patterns"
        languages: [ts, tsx, js, json]
        purpose: |
          React Native only — the JS `disabledUrlPatterns` in SDK_CONFIG is passed
          straight through to iOS `ignoredURLs`. Apply the same substring test to
          each pattern.
      - type: grep
        pattern: "CaptureServiceBuilder|captureServices|\\.urlSession\\("
        languages: [swift]
        purpose: |
          If capture services are customized, confirm URLSessionCaptureService is still
          in the list. Removing it disables Crashlytics crash capture entirely.
      - type: analyze
        purpose: |
          Pin down when it broke — the release/commit that introduced the ignore pattern
          should line up with the app version where crashes stopped.
    mcp_checks:
      - tool: get_crash_distribution
        purpose: Identify the app version where the crash count drops to zero.
      - tool: get_top_versions
        purpose: Confirm the affected versions are still shipping sessions — sessions present, crashes absent is the signature.
      - tool: list_network_domains
        purpose: Confirm `crashlyticsreports-pa.googleapis.com` is absent from captured domains on the broken versions (and present on earlier ones, if the ignore list was added later).
    canonical_answer: |
      Found it. When you use `CrashlyticsReporter`, XCOR RUM doesn't read crashes from
      Firebase directly — it captures them out of the Crashlytics upload request. The
      reporter watches for a captured request to `crashlyticsreports-pa.googleapis.com/batchlog`
      and pulls the crash out of the request body.

      Your ignore list contains a pattern that matches that URL, so the request never
      gets captured and the reporter never sees the crash. `ignoredURLs` is a substring
      match against the whole URL, so `googleapis.com` takes out
      `crashlyticsreports-pa.googleapis.com/batchlog` along with the third-party traffic
      you were trying to exclude. Crashlytics keeps receiving the crashes; XCOR RUM never
      hears about them.

      Suggested course of action:
      1. Narrow the pattern so it doesn't match the Crashlytics upload. Target the
         specific host or path you actually want to exclude (for example
         `firebaseinstallations.googleapis.com` or `firebaseremoteconfig.googleapis.com`)
         instead of `googleapis.com`.
      2. Ship it and confirm: `crashlyticsreports-pa.googleapis.com` should reappear in
         your captured network domains, and crashes should follow in the same version.
      3. Same rule for anything else you add later — if a pattern is a substring of
         `https://crashlyticsreports-pa.googleapis.com/batchlog`, it will disable your
         crash reporting. Note the request stays captured as a network span; if the noise
         is the problem, a `URLSessionRequestsDataSource` can drop or rewrite the span
         without blocking capture.
      4. Worth reconsidering `CrashlyticsReporter` itself. XCOR RUM's built-in reporter
         doesn't depend on network capture and gives you session properties, XCOR RUM
         resources, and last-run state, which the Crashlytics path can't:
         https://embrace.io/docs/ios/6x/manual-instrumentation/crash-reporting/

      On React Native the ignore list usually comes from `disabledUrlPatterns` in your
      JS SDK_CONFIG rather than Swift — it maps to the same iOS setting, so check there too.
    escalate_if:
      - "no ignore pattern matches the Crashlytics upload URL and URLSessionCaptureService is confirmed enabled, but crashes are still missing"
      - "the broad pattern has to stay and XCOR RUM should always capture the Crashlytics domain (no override exists)"
